# LangFuse self-hosted (Docker Compose)
# Correr:  docker compose up -d
# Dashboard: http://localhost:3000
#
# Primera vez:
# 1. Abrir http://localhost:3000 y crear cuenta admin.
# 2. Crear un proyecto "LIA-Colombo-AI".
# 3. Copiar las keys (Settings → API Keys) a un archivo .env en la raíz:
#       LANGFUSE_PUBLIC_KEY=pk-lf-...
#       LANGFUSE_SECRET_KEY=sk-lf-...
#       LANGFUSE_HOST=http://localhost:3000
# 4. Reiniciar la app Streamlit — ahora cada query se trazará en LangFuse.

services:
  langfuse-db:
    image: postgres:16
    container_name: lia-langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: lia-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: changeme-please-set-a-random-secret
      SALT: changeme-please-set-a-random-salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

volumes:
  langfuse_db_data:
