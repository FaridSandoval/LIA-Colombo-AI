[project]
name = "rag-chatbot-mvp"
version = "0.2.0"
description = "LIA-Colombo AI — RAG avanzado con hybrid search, re-ranker, contextual retrieval y observabilidad"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LangChain core
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "openai>=1.30.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-core>=1.2.28",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=0.1.2",
    # Embeddings + re-ranking
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.3.0",
    "transformers>=4.46,<5.0",
    "rank-bm25>=0.2.2",
    # Vector / lexical stores
    "faiss-cpu>=1.8.0",
    # Datasets / eval
    "ragas>=0.2.0",
    "datasets>=3.0.0",
    # Observability
    "langfuse>=2.50.0",
    # UI + I/O
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.1",
    "pypdf>=5.0.0",
    "pandas>=2.3.3",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.1",
    "protobuf<=3.20.3",
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.29.0",
]
